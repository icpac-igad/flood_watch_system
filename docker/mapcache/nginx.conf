worker_processes auto;

# pid file
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    types_hash_max_size 8192;
    server_names_hash_bucket_size 128;
    server_tokens off;
    ssi off;
    sendfile on;
    keepalive_timeout 3600s;
    gzip on;
    tcp_nopush on;
    tcp_nodelay on;
    # define main access log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    # default access log file
    access_log [LOGS_DIR]/access.log main;
    error_log [LOGS_DIR]/error.log error;
    # logging to stdout
    access_log /dev/stdout main;
    error_log /dev/stderr error;
    error_log /dev/stderr info;
    error_log /dev/stderr notice;
    error_log /dev/stderr warn;

    # Define the upstream FastCGI server (MapServer)
    upstream mapcache_backend {
        server 127.0.0.1:9001;
        keepalive [KEEPALIVE_CONNS]; # Keep n idle connections for each worker process
    }

    server {
        listen 8080;
        server_name localhost;

        root /etc/nginx/html;

        location @fastcgi_mapcache {
            fastcgi_pass   mapcache_backend;
            # Include standard FastCGI parameters
            include fastcgi_params;
            # SCRIPT_FILENAME is needed by MapCache FCGI to know its own executable path
            fastcgi_param SCRIPT_FILENAME /usr/local/bin/mapcache.fcgi;
            # Pass original query string, method, etc.
            fastcgi_param  QUERY_STRING     $query_string;
            fastcgi_param  REQUEST_METHOD   $request_method;
            fastcgi_param  CONTENT_TYPE     $content_type;
            fastcgi_param  CONTENT_LENGTH   $content_length;
            fastcgi_param  PATH_INFO        $path_info;
            fastcgi_param  SERVER_NAME      $server_name;
            fastcgi_param  SERVER_PORT      $server_port;
            fastcgi_param  SCRIPT_NAME      "/mapcache";
            # # Set this if you want MapCache to understand it's running behind a proxy
            fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_read_timeout 300s;  # How long NGINX waits for a response from MapCache
            fastcgi_send_timeout 300s;  # How long NGINX waits to send a request to MapCache
            fastcgi_connect_timeout 60s; # How long NGINX waits to connect to MapCache

            # Increase buffer sizes if large headers/responses are expected
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
        }

        # Route tile requests through MapCache FastCGI so dimensions and
        # requested output formats are handled by MapCache itself.
        location ~ ^/mapcache/(?<tileset>[^/]+)/(?<grid>[^/]+)/(?<z>[0-9]+)/(?<x>[0-9]+)/(?<y>[0-9]+)\.(?<ext>png|jpg|jpeg)$ {
            set $path_info /$tileset/$grid/$z/$x/$y.$ext;
            try_files /__mapcache_force_fastcgi__ @fastcgi_mapcache;

            # Client-side caching headers for efficient browser use (very important!)
            expires 30d; # Cache tiles for 30 days
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Served-By "Nginx/MapCache-FastCGI";
            add_header Access-Control-Allow-Origin *;
        }

        location ~ ^/mapcache(?<path_info>/.*|$) {
            try_files /__mapcache_force_fastcgi__ @fastcgi_mapcache;
            add_header Access-Control-Allow-Origin *;
        }

        # Default Nginx error pages (optional)
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /etc/nginx/html;
            internal;
        }

    }
}
