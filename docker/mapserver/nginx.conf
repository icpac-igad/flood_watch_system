worker_processes auto;

# pid file
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    types_hash_max_size 8192;
    server_names_hash_bucket_size 128;
    server_tokens off;
    ssi off;
    sendfile on;
    keepalive_timeout 3600s;
    gzip on;
    tcp_nopush on;
    tcp_nodelay on;
    # define main access log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    
    # default access log file
    access_log [LOGS_DIR]/access.log main;
    error_log [LOGS_DIR]/error.log error;
    # logging to stdout
    access_log /dev/stdout main;
    error_log /dev/stderr error;
    error_log /dev/stderr info;
    error_log /dev/stderr warn;

    # Define the upstream FastCGI server (MapServer)
    upstream mapserver_fcgi {
        # This refers to the port where spawn-fcgi will listen INSIDE the container
        # You can use a Unix socket if both Nginx and spawn-fcgi are in the same container
        server 127.0.0.1:9001;
        keepalive [KEEPALIVE_CONNS]; # Keep n idle connections for each worker process
    }

    server {
        listen 8080;
        server_name localhost; # Or your domain name

        root /var/www/html; # Default root for static files, if any

        # Location for MapServer requests
        location /mapserver/ {
            fastcgi_pass mapserver_fcgi;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /usr/local/bin/mapserv;
            fastcgi_read_timeout 300s;  # How long NGINX waits for a response from Mapserver
            fastcgi_send_timeout 300s;  # How long NGINX waits to send a request to Mapserver
            fastcgi_connect_timeout 60s; # How long NGINX waits to connect to Mapserver

            # Increase buffer sizes if large headers/responses are expected
            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_temp_file_write_size 256k;
            add_header Access-Control-Allow-Origin *;
        }
    }
}