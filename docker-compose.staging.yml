# EAFW FloodWatch - Staging
# Hosts: 197.254.1.10, 10.10.1.13, 0.0.0.0, 127.0.0.1
# Ports: 9060-9069 (nginx entry: 9068)
# Usage: docker compose -f docker-compose.staging.yml up -d

networks:
  default:
    name: eafw_network
    driver: bridge

services:
  eafw_db:
    container_name: ${DB_CNTR_NAME:-eafw-pgdb}
    command: postgres -c 'max_connections=${PG_MAX_CONNECTIONS:-120}'
    image: postgis/postgis:${PG_VERSION:-16-3.4}
    restart: ${RESTART_POLICY:-always}
    environment:
      - POSTGRES_USER=${CMS_DB_USER}
      - POSTGRES_DB=${CMS_DB_NAME}
      - POSTGRES_PASSWORD=${CMS_DB_PASSWORD}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    ports:
      - ${HOST_IP:-0.0.0.0}:${DB_HOST_PORT:-9060}:5432
    volumes:
      - ${CMS_DB_VOLUME}:/var/lib/postgresql/data/:z
      - ./eafw_docker/db-init:/docker-entrypoint-initdb.d/:z

  eafw_pgbouncer:
    image: edoburu/pgbouncer:${PGB_VERSION:-v1.23.1-p3}
    container_name: ${PGBOUNCER_CNTR_NAME:-eafw-pgbouncer}
    restart: ${RESTART_POLICY:-always}
    shm_size: "4gb"
    depends_on:
      - eafw_db
    ports:
      - ${PGB_HOST_IP:-${HOST_IP:-0.0.0.0}}:${PGB_HOST_PORT:-9061}:${PGB_LISTEN_PORT:-6432}
    environment:
      - LISTEN_PORT=${PGB_LISTEN_PORT:-6432}
      - DB_HOST=${PG_HOST:-eafw_db}
      - DB_PORT=${PG_PORT:-5432}
      - DB_NAME=${CMS_DB_NAME}
      - DB_USER=${CMS_DB_USER}
      - DB_PASSWORD=${CMS_DB_PASSWORD}
      - AUTH_USER=${CMS_DB_USER}
      - AUTH_TYPE=${PG_AUTH_METHOD:-scram-sha-256}
      - AUTH_DBNAME=${CMS_DB_NAME}
      - ADMIN_USERS=${CMS_DB_USER}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-1024}
      - POOL_MODE=${PGB_POOL_MODE:-session}
      - DEFAULT_POOL_SIZE=${PGB_DEFAULT_POOL_SIZE:-120}
      - SERVER_IDLE_TIMEOUT=${PGB_SERVER_IDLE_TIMEOUT:-600}
      - CLIENT_IDLE_TIMEOUT=${PGB_CLIENT_IDLE_TIMEOUT:-1500}
      - IDLE_TRANSACTION_TIMEOUT=${PGB_IDLE_TRANSACTION_TIMEOUT:-1200}
      - VERBOSE=${PGB_VERBOSE:-1}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path
      - TZ=${TIME_ZONE:-Africa/Nairobi}

  eafw_memcached:
    image: memcached:${MEMCACHED_VERSION:-1.6-alpine}
    container_name: ${MEMCACHED_CNTR_NAME:-eafw-memcached}
    restart: ${RESTART_POLICY:-always}
    ports:
      - ${HOST_IP:-0.0.0.0}:${CACHE_HOST_PORT:-9062}:11211
    entrypoint:
      - memcached
      - -m 1024
      - -I 10m

  eafw_cms:
    platform: linux/x86_64
    container_name: ${WEB_CNTR_NAME:-eafw-cms}
    image: ${WEB_IMAGE_NAME:-ghcr.io/icpac-igad/eafw-cms:latest}
    restart: ${RESTART_POLICY:-always}
    command: >
      sh -c "/wait
      && ./docker-entrypoint.sh
      && /opt/venv/bin/gunicorn geomanagerweb.asgi
      --bind 0.0.0.0:8000 --workers=${CMS_NUM_OF_WORKERS:-4} --worker-class=uvicorn.workers.UvicornWorker"
    expose:
      - "8000"
    environment:
      - WAIT_HOSTS=eafw_db:5432,eafw_memcached:11211
      - WAIT_TIMEOUT=${WEB_WAIT_TIME:-120}
      - DEBUG=${CMS_DEBUG:-False}
      - WAGTAIL_SITE_NAME=${CMS_SITE_NAME:-East Africa Flood Watch}
      - ADMIN_URL_PATH=${ADMIN_URL_PATH:-cms-admin}
      - TIME_ZONE=${TIME_ZONE:-Africa/Nairobi}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-197.254.1.10,10.10.1.13,0.0.0.0,127.0.0.1,localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://197.254.1.10,http://10.10.1.13,http://127.0.0.1,http://localhost,http://197.254.1.10:9068,http://10.10.1.13:9068}
      - DATABASE_URL=postgis://${CMS_DB_USER}:${CMS_DB_PASSWORD}@${PGB_HOST:-eafw_pgbouncer}:${PGB_PORT:-6432}/${CMS_DB_NAME}
      - MEMCACHED_URI=${MEMCACHED_URI:-eafw_memcached:11211}
      - MAPVIEWER_SERVER_URL=${MAPVIEWER_SERVER_URL:-http://eafw_mapviewer:3000}
      - WAGTAILADMIN_BASE_URL=${CMS_BASE_URL:-http://197.254.1.10:9068}
      - CMS_BASE_URL=${CMS_BASE_URL:-http://197.254.1.10:9068}
      - LANGUAGE_CODE=${CMS_DEFAULT_LANGUAGE_CODE:-en}
      - FORCE_SCRIPT_NAME=${FORCE_SCRIPT_NAME:-}
      - GEOMANAGER_AUTO_INGEST_RASTER_DATA_DIR=/geomanager/data
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-geomanagerweb.settings.production}
      - DJANGO_ALLOW_ASYNC_UNSAFE=${ALLOW_ASYNC_UNSAFE:-true}
      - SFTP_HOST=${SFTP_HOST}
      - SFTP_PORT=${SFTP_PORT:-22}
      - SFTP_USERNAME=${SFTP_USERNAME}
      - SFTP_PASSWORD=${SFTP_PASSWORD}
      - ENSEMBLE_FTP_HOST=${ENSEMBLE_FTP_HOST}
      - ENSEMBLE_FTP_PORT=${ENSEMBLE_FTP_PORT:-21}
      - ENSEMBLE_FTP_USER=${ENSEMBLE_FTP_USER}
      - ENSEMBLE_FTP_PASSWORD=${ENSEMBLE_FTP_PASSWORD}
      - ENSEMBLE_FTP_DIR=${ENSEMBLE_FTP_DIR}
    depends_on:
      - eafw_db
    ports:
      - ${HOST_IP:-0.0.0.0}:${WEB_HOST_PORT:-9063}:8000
    volumes:
      - ${CMS_STATIC_VOLUME}:/opt/eafw_cms/static:z
      - ${CMS_MEDIA_VOLUME}:/opt/eafw_cms/media:z
      - ${GEOMANAGER_AUTO_INGEST_DATA_VOLUME}:/geomanager/data:z
      - ./eafw_docker/volumes/cms/.cache:/root/.cache:z
      - ./eafw_cms/home/templates:/opt/eafw_cms/home/templates:z
      - ./eafw_docker/cms/seed:/opt/eafw_cms/seed:z

  eafw_mapviewer:
    platform: linux/x86_64
    container_name: ${MAPVIEWER_CNTR_NAME:-eafw-mapviewer}
    image: ${MAPVIEWER_IMAGE_NAME:-ghcr.io/icpac-igad/eafw-mapviewer:latest}
    restart: ${RESTART_POLICY:-always}
    volumes:
      - ${MAPVIEWER_NEXT_STATIC_VOLUME}:/app/nginx/.next/static:z
      - ./eafw_docker/volumes/mapviewer/.cache:/root/.cache:z
    ports:
      - ${HOST_IP:-0.0.0.0}:${UI_HOST_PORT:-9064}:3000

  eafw_mapserver:
    container_name: ${MAPSERVER_CNTR_NAME:-eafw-mapserver}
    image: ${MAPSERVER_IMAGE_NAME:-ghcr.io/icpac-igad/eafw-mapserver:latest}
    restart: ${RESTART_POLICY:-always}
    user: "0:0"
    depends_on:
      - eafw_pgbouncer
    ports:
      - ${HOST_IP:-0.0.0.0}:${MS_HOST_PORT:-9065}:${MS_APP_PORT:-80}
    environment:
      - MS_DEBUGLEVEL=${MS_DEBUGLEVEL:-2}
      - MS_ERRORFILE=${MS_ERRORFILE:-stderr}
      - MAPFILES_DIR=${MS_MAPFILES_DIR:-/opt/mapfiles}
      - MS_MAPFILE=${MS_MAPFILES_DIR:-/opt/mapfiles}/mapserver.map
      - MAPSERVER_CONFIG_FILE=${MS_MAPFILES_DIR:-/opt/mapfiles}/mapserver.conf
      - MAX_PROCESSES=${MS_MAX_PROCESSES:-10}
      - WGS84_GRID_EXTENTS=${WGS84_GRID_EXTENTS:-21 -12 52 23}
      - MS_SERVICE_URL=${MS_SERVICE_URL:-http://197.254.1.10:9065/mapserver/}
      - DB_HOST=${PGB_HOST:-eafw_pgbouncer}
      - DB_MAP_USER=${CMS_DB_USER}
      - DB_MAP_USER_PASSWORD=${CMS_DB_PASSWORD}
      - DB_NAME=${CMS_DB_NAME}
      - DB_PORT=${PGB_PORT:-6432}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    volumes:
      - ${MS_MAPFILES_VOLUME:-./data/mapfiles}:/opt/mapfiles:z

  eafw_mapcache:
    image: ${MAPCACHE_IMAGE_NAME:-ghcr.io/icpac-igad/eafw-mapcache:latest}
    container_name: ${MAPCACHE_CNTR_NAME:-eafw-mapcache}
    restart: ${RESTART_POLICY:-always}
    user: "0:0"
    depends_on:
      - eafw_mapserver
    ports:
      - ${HOST_IP:-0.0.0.0}:${MC_HOST_PORT:-9066}:${MC_APP_PORT:-80}
    volumes:
      - ${MC_TILES_DIR:-./data/mapcache/tiles}:${APP_TILES_DIR:-/opt/tiles}:z
    environment:
      - SERVICE_URL=${MC_SERVICE_URL:-http://197.254.1.10:9066/mapcache/}
      - SOURCE_URL=${MC_SOURCE_URL:-http://eafw_mapserver/mapserver/?}
      - MAPCACHE_CONFIG_FILE=${MC_CONFIG_FILE:-/opt/mapcache/mapcache.xml}
      - WEB_GRID_EXTENTS=${WEB_GRID_EXTENTS:-2337709 -1329087 5792092 2632018}
      - WGS84_GRID_EXTENTS=${WGS84_GRID_EXTENTS:-21 -12 52 23}
      - TILES_DIR=${APP_TILES_DIR:-/opt/tiles}
      - MAX_PROCESSES=${MC_MAX_PROCESSES:-10}
      - TILESET_EXPIRE_SEC=${MC_TILESET_EXPIRE_SEC:-3600}
      - THREADED_FETCHING=${MC_THREADED_FETCHING:-true}
      - NUM_THREADS=${MC_THREADS:-10}
      - ERROR_REPORTING=${MC_ERROR_REPORTING:-empty_img}
      - LOG_LEVEL=${MC_LOG_LEVEL:-debug}
      - TZ=${TIME_ZONE:-Africa/Nairobi}

  eafw_tileserv:
    container_name: ${TILESERV_CNTR_NAME:-eafw-tileserv}
    image: pramsey/pg_tileserv:${TILESERV_VERSION:-latest}
    restart: ${RESTART_POLICY:-always}
    depends_on:
      - eafw_pgbouncer
    environment:
      - DATABASE_URL=postgresql://${CMS_DB_USER}:${CMS_DB_PASSWORD}@eafw_db:5432/${CMS_DB_NAME}
      - TS_BASEPATH=/pg/tileserv
      - TS_DEBUG=${TILESERV_DEBUG:-false}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    ports:
      - ${HOST_IP:-0.0.0.0}:${TILESERV_HOST_PORT:-9067}:7800

  eafw_nginx:
    container_name: ${NGINX_CNTR_NAME:-eafw-nginx}
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    restart: ${RESTART_POLICY:-always}
    volumes:
      - ${CMS_STATIC_VOLUME}:/wagtail_static:z
      - ${CMS_MEDIA_VOLUME}:/wagtail_media:z
      - ${MAPVIEWER_NEXT_STATIC_VOLUME}:/mapviewer/static:z
      - ./eafw_docker/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:z
    ports:
      - ${HOST_IP:-0.0.0.0}:${CMS_HOST_PORT:-9068}:80
    depends_on:
      - eafw_cms

  eafw_api:
    platform: linux/x86_64
    container_name: ${API_CNTR_NAME:-eafw-api}
    image: ${API_IMAGE_NAME:-ghcr.io/icpac-igad/eafw-api:latest}
    restart: ${RESTART_POLICY:-always}
    depends_on:
      - eafw_pgbouncer
    ports:
      - ${HOST_IP:-0.0.0.0}:${API_HOST_PORT:-9069}:9060
    environment:
      - EAFW_DATABASE_HOST=${PGB_HOST:-eafw_pgbouncer}
      - EAFW_DATABASE_PORT=${PGB_LISTEN_PORT:-6432}
      - EAFW_DATABASE_NAME=${CMS_DB_NAME}
      - EAFW_DATABASE_USER=${CMS_DB_USER}
      - EAFW_DATABASE_PASSWORD=${CMS_DB_PASSWORD}
      - EAFW_DEBUG=${API_DEBUG:-false}
      - EAFW_CORS_ORIGINS=["*"]
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9060/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  eafw_jobs:
    platform: linux/x86_64
    container_name: ${JOBS_CNTR_NAME:-eafw-jobs}
    image: ${JOBS_IMAGE_NAME:-ghcr.io/icpac-igad/eafw-jobs:latest}
    restart: ${RESTART_POLICY:-always}
    depends_on:
      - eafw_db
    environment:
      - DB_HOST=${DB_JOBS_HOST:-eafw_db}
      - DB_PORT=${DB_JOBS_PORT:-5432}
      - DB_NAME=${CMS_DB_NAME}
      - DB_USER=${CMS_DB_USER}
      - DB_PASSWORD=${CMS_DB_PASSWORD}
      - FLOODPROOFS_SFTP_HOST=${FLOODPROOFS_SFTP_HOST:-197.254.113.173}
      - FLOODPROOFS_SFTP_PORT=${FLOODPROOFS_SFTP_PORT:-22}
      - FLOODPROOFS_SFTP_USER=${FLOODPROOFS_SFTP_USER:-floodproofs}
      - FLOODPROOFS_SFTP_PASSWORD=${FLOODPROOFS_SFTP_PASSWORD}
      - FLOODPROOFS_REMOTE_DIR=${FLOODPROOFS_REMOTE_DIR:-/home/floodproofs/merged_forecasts}
      - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
      - GOOGLE_CREDENTIALS_FILE=/opt/credentials/google-credentials.json
      - SYNC_SOURCE=${SYNC_SOURCE:-drive}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-21600}
      - SYNC_DAYS=${SYNC_DAYS:-7}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    volumes:
      - ${JOBS_DATA_VOLUME:-./eafw_jobs/data}:/opt/data:z
      - ${JOBS_LOGS_VOLUME:-./eafw_jobs/logs}:/opt/logs:z
      - ./eafw_jobs/credentials:/opt/credentials:z
