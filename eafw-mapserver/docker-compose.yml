services:
  eafw-db:
    image: postgis/postgis:${PG_POSTGIS_VERSION:-16-3.4}
    container_name: ${CONTAINER_NAME_PREFIX:-eafw}-pgdb
    restart: ${RESTART_POLICY:-unless-stopped}
    shm_size: "4gb"
    volumes:
      - ${PGDATA_DIR:-./data/pgdata}:/var/lib/postgresql/data
      - ./database/initdb:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: ${DB_USER:-gis}
      POSTGRES_PASSWORD: ${DB_PASS:-changeme}
      POSTGRES_DB: ${DB_NAME:-eafw}
      TZ: ${TIME_ZONE:-Africa/Nairobi}
    ports:
      - "${DB_HOST_IP:-127.0.0.1}:${DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gis} -d ${DB_NAME:-eafw}"]
      interval: 10s
      timeout: 5s
      retries: 5

  eafw-mapserver:
    build:
      context: mapserver
      dockerfile: Dockerfile
      args:
        - MAPFILES_DIR=${MS_MAPFILES_DIR:-/opt/mapfiles}
    container_name: ${CONTAINER_NAME_PREFIX:-eafw}-mapserver
    image: ${IMAGE_NAME_PREFIX:-icpac/eafw}-mapserver
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      eafw-db:
        condition: service_healthy
    ports:
      - "${MS_HOST_IP:-127.0.0.1}:${MS_HOST_PORT:-8481}:80"
    volumes:
      - ${MS_LOGS_DIR:-./data/mapserver-logs}:/var/log/nginx
    environment:
      - MS_DEBUGLEVEL=${MS_DEBUGLEVEL:-2}
      - MS_ERRORFILE=${MS_ERRORFILE:-stderr}
      - MAPFILES_DIR=${MS_MAPFILES_DIR:-/opt/mapfiles}
      - MS_MAPFILE=${MS_MAPFILES_DIR:-/opt/mapfiles}/mapserver.map
      - MAPSERVER_CONFIG_FILE=${MS_MAPFILES_DIR:-/opt/mapfiles}/mapserver.conf
      - MAX_PROCESSES=${MS_MAX_PROCESSES:-10}
      - WGS84_GRID_EXTENTS=${WGS84_GRID_EXTENTS:-21 -12 52 23}
      - MS_SERVICE_URL=${MS_SERVICE_URL:-http://localhost:8481/mapserver/}
      - DB_HOST=${DB_HOST:-eafw-db}
      - DB_MAP_USER=${DB_MAP_USER:-gis}
      - DB_MAP_USER_PASSWORD=${DB_PASS:-changeme}
      - DB_NAME=${DB_NAME:-eafw}
      - DB_PORT=${DB_PORT:-5432}
      - TZ=${TIME_ZONE:-Africa/Nairobi}

  eafw-mapcache:
    build:
      context: mapcache
      dockerfile: Dockerfile
      args:
        - HOME_DIR=${APP_HOME_DIR:-/opt/mapcache}
        - USER_ID=${APP_USER_ID:-1024}
    image: ${IMAGE_NAME_PREFIX:-icpac/eafw}-mapcache
    container_name: ${CONTAINER_NAME_PREFIX:-eafw}-mapcache
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - eafw-mapserver
    ports:
      - "${MC_HOST_IP:-127.0.0.1}:${MC_HOST_PORT:-8482}:80"
    volumes:
      - ${MC_TILES_DIR:-./data/tiles}:/opt/tiles
      - ${MC_LOGS_DIR:-./data/mapcache-logs}:/etc/nginx/logs
    environment:
      - SERVICE_URL=${SERVICE_URL:-http://localhost:8482/mapcache/}
      - SOURCE_URL=${SOURCE_URL:-http://eafw-mapserver/mapserver/?}
      - MAPCACHE_CONFIG_FILE=${MC_CONFIG_FILE:-/opt/mapcache/mapcache.xml}
      - WEB_GRID_EXTENTS=${WEB_GRID_EXTENTS:-2337709 -1329087 5792092 2632018}
      - WGS84_GRID_EXTENTS=${WGS84_GRID_EXTENTS:-21 -12 52 23}
      - TILES_DIR=${APP_TILES_DIR:-/opt/tiles}
      - MAX_PROCESSES=${MC_MAX_PROCESSES:-10}
      - TILESET_EXPIRE_SEC=${MC_TILESET_EXPIRE_SEC:-3600}
      - THREADED_FETCHING=${MC_THREADED_FETCHING:-true}
      - NUM_THREADS=${MC_THREADS:-10}
      - ERROR_REPORTING=${MC_ERROR_REPORTING:-empty_img}
      - LOG_LEVEL=${MC_LOG_LEVEL:-debug}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
