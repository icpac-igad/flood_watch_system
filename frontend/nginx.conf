server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Force HTTP only - clear any HSTS and prevent HTTPS upgrade
    add_header Strict-Transport-Security "max-age=0" always;

    # Gzip Settings - aggressive compression for JSON
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json application/geo+json;
    gzip_disable "MSIE [1-6]\.";

    # Root location - SPA setup
    location / {
        try_files $uri $uri/ /index.html;
        # Disable caching for HTML and JS files to prevent stale code
        location ~* \.(html|js)$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            if_modified_since off;
            add_header Last-Modified "";
            etag off;
        }
        # Cache other assets like CSS, images for 1 hour
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Data files location
    location /data/ {
        alias /usr/share/nginx/html/data/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin '*';
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers '*';
        try_files $uri =404;
    }

    # TimeSeries Data location - NEW SECTION
    location /timeseries_data/ {
        alias /etc/mapserver/data/timeseries_data/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin '*';
        add_header Access-Control-Allow-Methods 'GET, OPTIONS';
        add_header Access-Control-Allow-Headers '*';
        try_files $uri =404;
        
        # Enable CORS for JSON files
        location ~ \.geojson$ {
            add_header Access-Control-Allow-Origin '*';
            add_header Content-Type 'application/json';
        }
    }

    # FastAPI proxy for high-performance forecast data (must be before /api/)
    location /api/fast/ {
        proxy_pass http://fastapi:8001/api/fast/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "gzip";

        # Enable buffering for caching
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout 60s;

        # TEMPORARILY DISABLED: Disable caching to debug data issues
        # Cache forecast data for 1 hour (data doesn't change frequently)
        # proxy_cache_valid 200 1h;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Proxy-Backend "fastapi" always;

        # TEMPORARILY DISABLED: Disable browser caching to force fresh data
        # expires 1h;
        # add_header Cache-Control "public, max-age=3600";
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # TiPg proxy for vector tiles (must be before /api/)
    location /tipg/ {
        proxy_pass http://tipg:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Enable buffering for caching
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        proxy_read_timeout 60s;

        # Cache vector tiles for 24 hours (base data doesn't change often)
        proxy_cache_valid 200 24h;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Proxy-Backend "tipg" always;

        # Enable browser caching for 24 hours
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
    }

    # API proxy - proxies to Django backend container
    location /api/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Admin proxy - proxies Django admin to backend
    location /admin/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://backend:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Static files
    location /static/ {
        root /app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Media files
    location /media/ {
        root /app;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Logging
    access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/error.log warn;
}