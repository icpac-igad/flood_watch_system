worker_processes auto;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css text/js text/xml text/javascript application/x-javascript application/javascript application/json application/xml application/rss+xml image/svg+xml;
    gzip_disable "msie6";
    gzip_comp_level 6;

    client_max_body_size 4G;
    client_body_buffer_size 100M;

    large_client_header_buffers 16 2048k;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Rate limiting zone for public FloodWatch API traffic
    limit_req_zone $binary_remote_addr zone=api_public:10m rate=180r/m;
    limit_req_status 429;

    # ---- Proxy cache zones ----
    # Vector tiles: short TTL (30s) — data changes with each forecast run
    proxy_cache_path /tmp/nginx_tile_cache
        levels=1:2
        keys_zone=tile_cache:10m
        max_size=256m
        inactive=5m
        use_temp_path=off;

    # API responses: moderate TTL (60s) — summaries / GeoJSON
    proxy_cache_path /tmp/nginx_api_cache
        levels=1:2
        keys_zone=api_cache:10m
        max_size=128m
        inactive=5m
        use_temp_path=off;

    server {
        listen 80;

        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;

        # Resolve upstream hostnames at request time (not startup)
        resolver 127.0.0.11 valid=30s;
        set $api_upstream eafw_api:9060;
        set $cms_upstream eafw_cms:8000;
        set $mapviewer_upstream eafw_mapviewer:3000;
        set $tileserv_upstream eafw_tileserv:7800;
        set $mapserver_upstream eafw_mapserver;
        set $mapcache_upstream eafw_mapcache;
        set $stac_upstream eafw_stac:8080;
        set $stac_browser_upstream eafw_stac_browser:8085;
        set $titiler_upstream eafw_titiler:80;

        location / {
            proxy_pass http://$cms_upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_pass_request_headers on;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept";
        }

        location /_next/ {
            proxy_pass http://$mapviewer_upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_pass_request_headers on;
        }

        # Mapviewer favicon/public assets
        location = /favicon.ico {
            proxy_pass http://$mapviewer_upstream/favicon.ico;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_pass_request_headers on;
        }

        location /favicon/ {
            proxy_pass http://$mapviewer_upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_pass_request_headers on;
        }

        # Handle malformed mapviewer URLs: /tileserv/boundary/table -> /pg/tileserv/boundary.table
        location ~ ^/tileserv/([^/]+)/(.+)$ {
            rewrite ^/tileserv/([^/]+)/(.+)$ /pg/tileserv/$1.$2 break;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://$tileserv_upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Ensure MapLibre receives plain MVT bytes (not gzip-wrapped payloads).
            gzip off;
            proxy_set_header Accept-Encoding "";

            # Hide upstream CORS header to avoid duplicate "*, *"
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
        }

        location /pg/tileserv/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://$tileserv_upstream$request_uri;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Ensure MapLibre receives plain MVT bytes (not gzip-wrapped payloads).
            gzip off;
            proxy_set_header Accept-Encoding "";

            # Hide upstream CORS header to avoid duplicate "*, *"
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;

            # Cache vector tiles for 30s — avoids repeated DB hits on pan/zoom
            proxy_cache tile_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 30s;
            proxy_cache_valid 204 5s;
            proxy_cache_valid any 0;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=30" always;
        }

        location /mapserver/ {
            proxy_pass http://$mapserver_upstream$request_uri;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept";
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /mapcache/ {
            # Forward with /mapcache/ prefix intact — MapCache expects it
            proxy_pass http://$mapcache_upstream$request_uri;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept";
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # Admin boundary tiles - proxy to tileserv
        location ~ ^/api/admin-boundary/tiles/(\d+)/(\d+)/(\d+)$ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://$tileserv_upstream/pg/tileserv/gha.admin_clipped/$1/$2/$3.pbf?admin_level=0;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide upstream CORS header to avoid duplicate "*, *"
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
        }

        # Prevent stale mapviewer config payloads from old browser cache.
        location = /api/v1/mapviewer-config {
            limit_req zone=api_public burst=60 nodelay;
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide upstream CORS headers (FastAPI CORSMiddleware) to avoid duplicate "*, *"
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location = /api/v1/mapviewer-config/ {
            limit_req zone=api_public burst=60 nodelay;
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide upstream CORS headers (FastAPI CORSMiddleware) to avoid duplicate "*, *"
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        location /api/v1/datasets/mapviewer/ {
            limit_req zone=api_public burst=60 nodelay;
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide upstream CORS headers (FastAPI CORSMiddleware) to avoid duplicate "*, *"
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken" always;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # FastAPI - versioned API (v1)
        location /api/v1/ {
            limit_req zone=api_public burst=60 nodelay;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Hide upstream CORS headers (FastAPI CORSMiddleware) to avoid duplicate "*, *"
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken" always;

            # Cache GET responses for 60s — covers summaries, GeoJSON, charts
            proxy_cache api_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 60s;
            proxy_cache_valid any 0;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # FastAPI docs & OpenAPI schema
        location /api/docs {
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/redoc {
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/openapi.json {
            proxy_pass http://$api_upstream$request_uri;
            add_header Access-Control-Allow-Origin *;
        }

        # FastAPI health
        location /health {
            proxy_pass http://$api_upstream/health;
            add_header Access-Control-Allow-Origin *;
        }

        # ============================================================
        # STAC Routing
        # Public UI:  /stac-browser/
        # STAC API:   /stac-browser/api/
        # ============================================================
        # STAC API (machine clients)
        location /stac-browser/api/ {
            # Handle CORS preflight fully in nginx (no backend round-trip).
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, X-API-Key";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }

            rewrite ^/stac-browser/api/(.*)$ /$1 break;
            proxy_pass http://$stac_upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";

            # Rewrite absolute STAC href links to internal relative paths
            sub_filter_types application/json application/geo+json;
            sub_filter_once off;
            sub_filter '"href":"http://127.0.0.1:9068/stac-browser/api/' '"href":"/stac-browser/api/';
            sub_filter '"href":"http://localhost:9068/stac-browser/api/' '"href":"/stac-browser/api/';
            sub_filter '"href":"http://$http_host/stac-browser/api/' '"href":"/stac-browser/api/';
            sub_filter '"href":"https://$http_host/stac-browser/api/' '"href":"/stac-browser/api/';

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, X-API-Key";

            if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
                set $stac_write "write";
            }
            if ($http_x_api_key = "") {
                set $stac_write "${stac_write}_nokey";
            }
            if ($stac_write = "write_nokey") {
                return 403 '{"detail": "API key required for write operations"}';
            }
        }

        # STAC Browser UI (human users)
        location /stac-browser/ {
            # Normalize stale absolute-url routes from older browser sessions.
            # Keep navigation on one canonical entrypoint to avoid client-side loops.
            rewrite ^/stac-browser/external/https?://[^/]+/stac-browser/api/.*$ / break;
            rewrite ^/stac-browser/external/https?://[^/]+/stac-browser/.*$ / break;
            rewrite ^/stac-browser/external/https?://[^/]+/flood-api/stac/.*$ / break;
            rewrite ^/stac-browser/external/https?://[^/]+/stac/.*$ / break;
            rewrite ^/stac-browser/https?://[^/]+/stac-browser/api/.*$ / break;
            rewrite ^/stac-browser/https?://[^/]+/stac-browser/.*$ / break;
            rewrite ^/stac-browser/(.*)$ /$1 break;
            proxy_pass http://$stac_browser_upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        location /cog-tiles/ {
            rewrite ^/cog-tiles/(.*)$ /$1 break;
            proxy_pass http://$titiler_upstream;
            proxy_redirect off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept";
        }

        # Static assets for STAC items (thumbnails, vector snapshots)
        location /stac-assets/ {
            alias /stac_assets/;
            autoindex off;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=300";
        }

        # Read-only COG files referenced by STAC item assets
        location /stac-cogs/ {
            alias /stac_cogs/;
            autoindex off;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=300";
            types {
                image/tiff tif;
                image/tiff tiff;
            }
        }

        # Read-only raster files referenced by STAC item assets
        location /stac-rasters/ {
            alias /stac_rasters/;
            autoindex off;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "public, max-age=300";
            types {
                image/tiff tif;
                image/tiff tiff;
            }
        }
    }

}
