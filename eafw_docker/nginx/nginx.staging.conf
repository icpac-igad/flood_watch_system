worker_processes auto;
error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    client_max_body_size 4G;

    server {
        listen 80;
        resolver 127.0.0.11 valid=30s;
        set $api_upstream eafw_api:9060;

        location / {
            proxy_pass http://eafw_cms:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /static/ {
            alias /wagtail_static/;
        }

        location /media/ {
            alias /wagtail_media/;
            add_header Access-Control-Allow-Origin *;
        }

        location /_next/ {
            proxy_pass http://eafw_mapviewer:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $http_host;
        }

        location /pg/tileserv/ {
            proxy_pass http://eafw_tileserv:7800/pg/tileserv/;
            add_header Access-Control-Allow-Origin *;
        }

        # FastAPI - versioned API (v1)
        location /api/v1/ {
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-API-Key, X-CSRFToken";
        }

        # FastAPI docs & OpenAPI schema
        location /api/docs {
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/openapi.json {
            proxy_pass http://$api_upstream$request_uri;
            add_header Access-Control-Allow-Origin *;
        }

        # FastAPI - Health check
        location /health {
            proxy_pass http://$api_upstream/health;
            add_header Access-Control-Allow-Origin *;
        }
    }
}
