# EAFW FloodWatch - Local Development
# Ports: 9060-9069 (nginx entry: 9068)
# Usage: docker compose up --build

networks:
  default:
    name: eafw_network
    driver: bridge

volumes:
  eafw_pgdata:
    name: eafw_pgdata
  eafw_static:
    name: eafw_static
  eafw_media:
    name: eafw_media
  eafw_mapviewer_static:
    name: eafw_mapviewer_static
  eafw_geomanager_data:
    name: eafw_geomanager_data
  eafw_mapcache_tiles:
    name: eafw_mapcache_tiles
  eafw_jobs_data:
    name: eafw_jobs_data
  eafw_jobs_logs:
    name: eafw_jobs_logs
  eafw_backups:
    name: eafw_backups

services:
  eafw_pgdb:
    container_name: ${DB_CNTR_NAME:-eafw-pgdb}
    command: postgres -c 'max_connections=${PG_MAX_CONNECTIONS:-120}'
    image: postgis/postgis:${PG_VERSION:-16-3.4}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - POSTGRES_USER=${CMS_DB_USER}
      - POSTGRES_DB=${CMS_DB_NAME}
      - POSTGRES_PASSWORD=${CMS_DB_PASSWORD}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    expose:
      - "5432"
    volumes:
      - eafw_pgdata:/var/lib/postgresql/data/
      - eafw_backups:/backups
      - ./eafw_docker/db-init:/docker-entrypoint-initdb.d/:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CMS_DB_USER:-eafw_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  eafw_pgbouncer:
    image: edoburu/pgbouncer:${PGB_VERSION:-v1.23.1-p3}
    container_name: ${PGBOUNCER_CNTR_NAME:-eafw-pgbouncer}
    restart: ${RESTART_POLICY:-unless-stopped}
    shm_size: "4gb"
    depends_on:
      eafw_pgdb:
        condition: service_healthy
    expose:
      - "${PGB_LISTEN_PORT:-6432}"
    environment:
      - LISTEN_PORT=${PGB_LISTEN_PORT:-6432}
      - DB_HOST=${PG_HOST:-eafw_pgdb}
      - DB_PORT=${PG_PORT:-5432}
      - DB_NAME=${CMS_DB_NAME}
      - DB_USER=${CMS_DB_USER}
      - DB_PASSWORD=${CMS_DB_PASSWORD}
      - AUTH_USER=${CMS_DB_USER}
      - AUTH_TYPE=${PG_AUTH_METHOD:-scram-sha-256}
      - AUTH_DBNAME=${CMS_DB_NAME}
      - ADMIN_USERS=${CMS_DB_USER}
      - MAX_CLIENT_CONN=${PGBOUNCER_MAX_CLIENT_CONN:-1024}
      - POOL_MODE=${PGB_POOL_MODE:-session}
      - DEFAULT_POOL_SIZE=${PGB_DEFAULT_POOL_SIZE:-120}
      - SERVER_IDLE_TIMEOUT=${PGB_SERVER_IDLE_TIMEOUT:-600}
      - CLIENT_IDLE_TIMEOUT=${PGB_CLIENT_IDLE_TIMEOUT:-1500}
      - IDLE_TRANSACTION_TIMEOUT=${PGB_IDLE_TRANSACTION_TIMEOUT:-1200}
      - VERBOSE=${PGB_VERBOSE:-1}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits,search_path

  eafw_memcached:
    image: memcached:${MEMCACHED_VERSION:-1.6-alpine}
    container_name: ${MEMCACHED_CNTR_NAME:-eafw-memcached}
    restart: ${RESTART_POLICY:-unless-stopped}
    expose:
      - "11211"
    entrypoint:
      - memcached
      - -m 1024
      - -I 10m

  eafw_cms:
    platform: linux/x86_64
    container_name: ${WEB_CNTR_NAME:-eafw-cms}
    image: ${WEB_IMAGE_NAME:-icpac/eafw-cms:local}
    pull_policy: never
    build:
      context: .
      dockerfile: eafw_docker/cms/Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    command: >
      sh -c "/wait
      && ./docker-entrypoint.sh
      && /opt/venv/bin/gunicorn geomanagerweb.asgi
      --bind 0.0.0.0:8000 --workers=${CMS_NUM_OF_WORKERS:-4} --worker-class=uvicorn.workers.UvicornWorker"
    expose:
      - "8000"
    environment:
      - WAIT_HOSTS=eafw_pgdb:5432,eafw_memcached:11211
      - WAIT_TIMEOUT=${WEB_WAIT_TIME:-120}
      - DEBUG=${CMS_DEBUG:-False}
      - WAGTAIL_SITE_NAME=${CMS_SITE_NAME:-localhost}
      - ADMIN_URL_PATH=${ADMIN_URL_PATH:-cms-admin}
      - TIME_ZONE=${TIME_ZONE:-Africa/Nairobi}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:9068,http://localhost:9068}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:9068,http://localhost:9068}
      - DATABASE_URL=postgis://${CMS_DB_USER}:${CMS_DB_PASSWORD}@${PGB_HOST:-eafw_pgbouncer}:${PGB_PORT:-6432}/${CMS_DB_NAME}
      - MEMCACHED_URI=${MEMCACHED_URI:-eafw_memcached:11211}
      - MAPVIEWER_SERVER_URL=${MAPVIEWER_SERVER_URL:-http://eafw_mapviewer:3000}
      - WAGTAILADMIN_BASE_URL=${CMS_BASE_URL:-http://localhost:9068}
      - CMS_BASE_URL=${CMS_BASE_URL:-http://localhost:9068}
      - LANGUAGE_CODE=${CMS_DEFAULT_LANGUAGE_CODE:-en}
      - FORCE_SCRIPT_NAME=${FORCE_SCRIPT_NAME:-}
      - GEOMANAGER_AUTO_INGEST_RASTER_DATA_DIR=/geomanager/data
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-geomanagerweb.settings.production}
      - DJANGO_ALLOW_ASYNC_UNSAFE=${ALLOW_ASYNC_UNSAFE:-true}
    depends_on:
      eafw_pgdb:
        condition: service_healthy
    volumes:
      - eafw_static:/opt/eafw_cms/static
      - eafw_media:/opt/eafw_cms/media
      - eafw_geomanager_data:/geomanager/data
      - ./eafw_docker/volumes/cms/.cache:/root/.cache:z
      - ${CMS_LOG_FILE:-./logs/cms-web.log}:/opt/eafw_cms/cms-web.log:z
      - ./eafw_cms/home/templates:/opt/eafw_cms/home/templates:z
      - ./eafw_docker/cms/seed:/opt/eafw_cms/seed:z
      - ${MS_MAPFILES_VOLUME:-./data/mapfiles}/data:/opt/rasterdata:ro,z

  eafw_mapviewer:
    platform: linux/x86_64
    container_name: ${MAPVIEWER_CNTR_NAME:-eafw-mapviewer}
    image: ${MAPVIEWER_IMAGE_NAME:-icpac/eafw-mapviewer:local}
    pull_policy: never
    restart: ${RESTART_POLICY:-unless-stopped}
    build:
      context: .
      dockerfile: eafw_docker/mapviewer/Dockerfile
      args:
        - CMS_API=${MAPVIEWER_CMS_API}
        - BASE_PATH=${MAPVIEWER_BASE_PATH}
        - ASSET_PREFIX=${MAPVIEWER_ASSET_PREFIX}
        - ANALYTICS_PROPERTY_ID=${ANALYTICS_PROPERTY_ID}
        - BITLY_TOKEN=${BITLY_TOKEN}
        - GOOGLE_CUSTOM_SEARCH_CX=${GOOGLE_CUSTOM_SEARCH_CX}
        - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
        - ADMIN_BOUNDARY_API=${ADMIN_BOUNDARY_API}
        - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - eafw_mapviewer_static:/app/nginx/.next/static
      - ./eafw_docker/volumes/mapviewer/.cache:/root/.cache:z
    expose:
      - "3000"

  eafw_mapserver:
    build:
      context: .
      dockerfile: eafw_docker/mapserver/Dockerfile
      args:
        - MAPFILES_DIR=${MS_MAPFILES_DIR:-/opt/mapfiles}
        - PROJ_DATA=${PROJ_DATA_DIR:-/usr/local/share/proj/}
        - GDAL_DATA=${GDAL_DATA_DIR:-/usr/share/gdal}
    container_name: ${MAPSERVER_CNTR_NAME:-eafw-mapserver}
    image: ${MAPSERVER_IMAGE_NAME:-icpac/eafw-mapserver:local}
    pull_policy: never
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - eafw_pgbouncer
    expose:
      - "${MS_APP_PORT:-80}"
    environment:
      - MS_DEBUGLEVEL=${MS_DEBUGLEVEL:-2}
      - MS_ERRORFILE=${MS_ERRORFILE:-stderr}
      - MAPFILES_DIR=${MS_MAPFILES_DIR:-/opt/mapfiles}
      - MS_MAPFILE=${MS_MAPFILES_DIR:-/opt/mapfiles}/mapserver.map
      - MAPSERVER_CONFIG_FILE=${MS_MAPFILES_DIR:-/opt/mapfiles}/mapserver.conf
      - MAX_PROCESSES=${MS_MAX_PROCESSES:-10}
      - WGS84_GRID_EXTENTS=${WGS84_GRID_EXTENTS:-21 -12 52 23}
      - MS_SERVICE_URL=${MS_SERVICE_URL:-http://localhost:9065/mapserver/}
      - DB_HOST=${PGB_HOST:-eafw_pgbouncer}
      - DB_MAP_USER=${CMS_DB_USER}
      - DB_MAP_USER_PASSWORD=${CMS_DB_PASSWORD}
      - DB_NAME=${CMS_DB_NAME}
      - DB_PORT=${PGB_PORT:-6432}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    volumes:
      - ${MS_MAPFILES_VOLUME:-./data/mapfiles}:/opt/mapfiles:z

  eafw_mapcache:
    build:
      context: .
      dockerfile: eafw_docker/mapcache/Dockerfile
      args:
        - HOME_DIR=${APP_HOME_DIR:-/opt/mapcache}
        - USER_ID=${APP_USER_ID:-1024}
        - MAPCACHE_BRANCH=${MAPCACHE_BRANCH:-main}
        - NGINX_VERISON=${NGINX_VERISON:-1.24.0}
    image: ${MAPCACHE_IMAGE_NAME:-icpac/eafw-mapcache:local}
    pull_policy: never
    container_name: ${MAPCACHE_CNTR_NAME:-eafw-mapcache}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - eafw_mapserver
    expose:
      - "${MC_APP_PORT:-80}"
    volumes:
      - eafw_mapcache_tiles:/opt/tiles
    environment:
      - SERVICE_URL=${MC_SERVICE_URL:-http://localhost:9066/mapcache/}
      - SOURCE_URL=${MC_SOURCE_URL:-http://eafw_mapserver/mapserver/?}
      - MAPCACHE_CONFIG_FILE=${MC_CONFIG_FILE:-/opt/mapcache/mapcache.xml}
      - WEB_GRID_EXTENTS=${WEB_GRID_EXTENTS:-2337709 -1329087 5792092 2632018}
      - WGS84_GRID_EXTENTS=${WGS84_GRID_EXTENTS:-21 -12 52 23}
      - TILES_DIR=${APP_TILES_DIR:-/opt/tiles}
      - MAX_PROCESSES=${MC_MAX_PROCESSES:-10}
      - TILESET_EXPIRE_SEC=${MC_TILESET_EXPIRE_SEC:-3600}
      - THREADED_FETCHING=${MC_THREADED_FETCHING:-true}
      - NUM_THREADS=${MC_THREADS:-10}
      - ERROR_REPORTING=${MC_ERROR_REPORTING:-empty_img}
      - LOG_LEVEL=${MC_LOG_LEVEL:-debug}
      - TZ=${TIME_ZONE:-Africa/Nairobi}

  eafw_tileserv:
    container_name: ${TILESERV_CNTR_NAME:-eafw-tileserv}
    image: pramsey/pg_tileserv:${TILESERV_VERSION:-latest}
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - eafw_pgbouncer
    environment:
      - DATABASE_URL=postgresql://${CMS_DB_USER}:${CMS_DB_PASSWORD}@eafw_pgbouncer:${PGB_LISTEN_PORT:-6432}/${CMS_DB_NAME}
      - TS_BASEPATH=/pg/tileserv
      - TS_DEBUG=${TILESERV_DEBUG:-false}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    expose:
      - "7800"

  eafw_nginx:
    container_name: ${NGINX_CNTR_NAME:-eafw-nginx}
    image: nginx:${NGINX_VERSION:-1.27-alpine}
    restart: ${RESTART_POLICY:-unless-stopped}
    volumes:
      - eafw_static:/wagtail_static:ro
      - eafw_media:/wagtail_media:ro
      - eafw_mapviewer_static:/mapviewer/static:ro
      - ./raster-data/cogs:/stac_cogs:ro,z
      - ./raster-data/source:/stac_rasters:ro,z
      - ./eafw_stac/assets:/stac_assets:ro,z
      - ./eafw_docker/nginx/nginx.local.conf:/etc/nginx/nginx.conf:z
    ports:
      - ${HOST_IP:-127.0.0.1}:${CMS_HOST_PORT:-9068}:80
    depends_on:
      - eafw_cms
      - eafw_api

  eafw_api:
    platform: linux/x86_64
    container_name: ${API_CNTR_NAME:-eafw-api}
    image: ${API_IMAGE_NAME:-icpac/eafw-api:local}
    pull_policy: never
    build:
      context: ./eafw_api
      dockerfile: Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - eafw_pgbouncer
    expose:
      - "9060"
    environment:
      - EAFW_DATABASE_HOST=${PGB_HOST:-eafw_pgbouncer}
      - EAFW_DATABASE_PORT=${PGB_LISTEN_PORT:-6432}
      - EAFW_DATABASE_NAME=${CMS_DB_NAME}
      - EAFW_DATABASE_USER=${CMS_DB_USER}
      - EAFW_DATABASE_PASSWORD=${CMS_DB_PASSWORD}
      - EAFW_DEBUG=${API_DEBUG:-false}
      - EAFW_CORS_ORIGINS=["*"]
      - EAFW_CMS_API_BASE_URL=${EAFW_CMS_API_BASE_URL:-http://eafw_cms:8000/api}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9060/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  eafw_jobs:
    platform: linux/x86_64
    container_name: ${JOBS_CNTR_NAME:-eafw-jobs}
    image: ${JOBS_IMAGE_NAME:-icpac/eafw-jobs:local}
    pull_policy: never
    build:
      context: .
      dockerfile: eafw_docker/jobs/Dockerfile
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - eafw_pgdb
    environment:
      - DB_HOST=${DB_JOBS_HOST:-eafw_pgdb}
      - DB_PORT=${DB_JOBS_PORT:-5432}
      - DB_NAME=${CMS_DB_NAME}
      - DB_USER=${CMS_DB_USER}
      - DB_PASSWORD=${CMS_DB_PASSWORD}
      - FLOODPROOFS_SFTP_HOST=${FLOODPROOFS_SFTP_HOST}
      - FLOODPROOFS_SFTP_PORT=${FLOODPROOFS_SFTP_PORT:-22}
      - FLOODPROOFS_SFTP_USER=${FLOODPROOFS_SFTP_USER}
      - FLOODPROOFS_SFTP_PASSWORD=${FLOODPROOFS_SFTP_PASSWORD}
      - FLOODPROOFS_REMOTE_DIR=${FLOODPROOFS_REMOTE_DIR:-/home/floodproofs/merged_forecasts}
      - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
      - GOOGLE_CREDENTIALS_FILE=/opt/credentials/google-credentials.json
      - SYNC_SOURCE=${SYNC_SOURCE:-drive}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-21600}
      - SYNC_DAYS=${SYNC_DAYS:-7}
      - FLOODS_API_KEY=${FLOODS_API_KEY}
      - GOOGLE_FLOOD_REGION_CODES=${GOOGLE_FLOOD_REGION_CODES:-ET,KE,UG,SD,SS,RW,SO,DJ,ER,TZ,BI}
      - GOOGLE_FLOOD_PAGE_SIZE=${GOOGLE_FLOOD_PAGE_SIZE:-20000}
      - GOOGLE_FLOOD_STATUS_CHUNK_SIZE=${GOOGLE_FLOOD_STATUS_CHUNK_SIZE:-500}
      - GOOGLE_FLOOD_MODEL_CHUNK_SIZE=${GOOGLE_FLOOD_MODEL_CHUNK_SIZE:-200}
      - GOOGLE_FLOOD_FORECAST_CHUNK_SIZE=${GOOGLE_FLOOD_FORECAST_CHUNK_SIZE:-200}
      - GOOGLE_FLOOD_ISSUED_LOOKBACK_DAYS=${GOOGLE_FLOOD_ISSUED_LOOKBACK_DAYS:-7}
      - GOOGLE_FLOOD_INCLUDE_NON_QUALITY_VERIFIED=${GOOGLE_FLOOD_INCLUDE_NON_QUALITY_VERIFIED:-true}
      - GOOGLE_FLOOD_INCLUDE_GAUGES_WITHOUT_HYDRO_MODEL=${GOOGLE_FLOOD_INCLUDE_GAUGES_WITHOUT_HYDRO_MODEL:-true}
      - GOOGLE_FLOOD_REQUEST_TIMEOUT_SECONDS=${GOOGLE_FLOOD_REQUEST_TIMEOUT_SECONDS:-120}
      - GOOGLE_FLOOD_MAX_RETRIES=${GOOGLE_FLOOD_MAX_RETRIES:-4}
      - GOOGLE_FLOOD_BASE_BACKOFF_SECONDS=${GOOGLE_FLOOD_BASE_BACKOFF_SECONDS:-1.0}
      - WRF_FTP_HOST=${WRF_FTP_HOST}
      - WRF_FTP_PORT=${WRF_FTP_PORT:-21}
      - WRF_FTP_USER=${WRF_FTP_USER}
      - WRF_FTP_PASSWORD=${WRF_FTP_PASSWORD}
      - WRF_REMOTE_DIR=${WRF_REMOTE_DIR:-/SharedData/wrf/weekly}
      - EMAIL_NOTIFICATIONS_ENABLED=${EMAIL_NOTIFICATIONS_ENABLED:-true}
      - SMTP_HOST=${SMTP_HOST:-${SMTP_EMAIL_HOST:-smtp.gmail.com}}
      - SMTP_PORT=${SMTP_PORT:-${SMTP_EMAIL_PORT:-587}}
      - SMTP_USER=${SMTP_USER:-${SMTP_EMAIL_HOST_USER}}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-${SMTP_EMAIL_HOST_PASSWORD}}
      - EMAIL_FROM=${EMAIL_FROM:-${SMTP_USER:-${SMTP_EMAIL_HOST_USER}}}
      - EMAIL_TO=${EMAIL_TO:-hkoros@icpac.net}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    volumes:
      - eafw_jobs_data:/opt/data
      - eafw_jobs_logs:/opt/logs
      - eafw_backups:/backups
      - ./eafw_jobs/credentials:/opt/credentials:z
      - ./raster-data/cogs:/data/cogs:z
      - ./raster-data/source:/data/rasters:ro,z

  eafw_storymaps:
    platform: linux/x86_64
    container_name: ${STORYMAPS_CNTR_NAME:-eafw-storymaps}
    image: ${STORYMAPS_IMAGE_NAME:-icpac/eafw-storymaps:local}
    pull_policy: never
    restart: ${RESTART_POLICY:-unless-stopped}
    build:
      context: .
      dockerfile: eafw_docker/storymaps/Dockerfile
    environment:
      - NEXT_PUBLIC_STAC_API=${STORYMAPS_STAC_API:-/stac-browser/api}
      - NEXT_PUBLIC_RASTER_API=${STORYMAPS_RASTER_API:-/cog-tiles}
      - NEXT_TELEMETRY_DISABLED=1
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    expose:
      - "3001"

  # ============================================================
  # eoAPI / STAC Services
  # ============================================================

  eafw_stac:
    container_name: ${STAC_CNTR_NAME:-eafw-stac}
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:${STAC_FASTAPI_VERSION:-5.0.2}
    restart: ${RESTART_POLICY:-unless-stopped}
    command: ["uvicorn", "stac_fastapi.pgstac.app:app", "--host", "0.0.0.0", "--port", "8080", "--root-path", "/stac-browser/api"]
    depends_on:
      eafw_pgdb:
        condition: service_healthy
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8080
      - STAC_FASTAPI_TITLE=FloodWatch STAC API
      - STAC_FASTAPI_DESCRIPTION=Regional catalog for hazard, rainfall, exposure, and multimodal operational layers
      - STAC_FASTAPI_LANDING_ID=floodwatch-stac
      - POSTGRES_USER=${CMS_DB_USER}
      - POSTGRES_PASS=${CMS_DB_PASSWORD}
      - POSTGRES_DBNAME=${CMS_DB_NAME}
      - POSTGRES_HOST_READER=eafw_pgdb
      - POSTGRES_HOST_WRITER=eafw_pgdb
      - POSTGRES_PORT=5432
      - DB_MIN_CONN_SIZE=${STAC_DB_MIN_CONN:-1}
      - DB_MAX_CONN_SIZE=${STAC_DB_MAX_CONN:-10}
      - TITILER_ENDPOINT=${STAC_TITILER_ENDPOINT:-http://eafw_titiler:80}
      - STAC_FASTAPI_TITLE=${STAC_FASTAPI_TITLE:-FloodWatch STAC API}
      - STAC_FASTAPI_DESCRIPTION=${STAC_FASTAPI_DESCRIPTION:-Regional catalog for hazard, rainfall, exposure, and multimodal operational layers}
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  eafw_titiler:
    container_name: ${TITILER_CNTR_NAME:-eafw-titiler}
    image: ghcr.io/stac-utils/titiler-pgstac:${TITILER_VERSION:-1.7.2}
    platform: linux/amd64
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      eafw_pgdb:
        condition: service_healthy
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=80
      - UVICORN_ROOT_PATH=/cog-tiles
      - POSTGRES_USER=${CMS_DB_USER}
      - POSTGRES_PASS=${CMS_DB_PASSWORD}
      - POSTGRES_DBNAME=${CMS_DB_NAME}
      - POSTGRES_HOST=eafw_pgdb
      - POSTGRES_PORT=5432
      - DB_MIN_CONN_SIZE=${TITILER_DB_MIN_CONN:-1}
      - DB_MAX_CONN_SIZE=${TITILER_DB_MAX_CONN:-10}
      # GDAL performance tuning
      - GDAL_CACHEMAX=200
      - GDAL_INGESTED_BYTES_AT_OPEN=32768
      - GDAL_DISABLE_READDIR_ON_OPEN=EMPTY_DIR
      - GDAL_HTTP_MERGE_CONSECUTIVE_RANGES=YES
      - GDAL_HTTP_MULTIPLEX=YES
      - GDAL_HTTP_VERSION=2
      - VSI_CACHE=TRUE
      - VSI_CACHE_SIZE=536870912
      - CPL_VSIL_CURL_ALLOWED_EXTENSIONS=.tif,.tiff,.TIF,.TIFF
      - TZ=${TIME_ZONE:-Africa/Nairobi}
    expose:
      - "80"
    volumes:
      - ./raster-data/cogs:/data/cogs:ro,z
      - ./raster-data/cogs:/stac-cogs:ro,z
      - ./raster-data/source:/data/rasters:ro,z
      - ./raster-data/source:/stac-rasters:ro,z
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    profiles:
      - titiler

  eafw_stac_browser:
    container_name: ${STAC_BROWSER_CNTR_NAME:-eafw-stac-browser}
    build:
      context: ./eafw_docker/stac
      dockerfile: Dockerfile.stac-browser
      args:
        - STAC_API_URL=${STAC_BROWSER_CATALOG_URL:-/stac-browser/api/}
    image: ${STAC_BROWSER_IMAGE_NAME:-icpac/eafw-stac-browser:local}
    pull_policy: never
    restart: ${RESTART_POLICY:-unless-stopped}
    depends_on:
      - eafw_stac
    expose:
      - "8085"
