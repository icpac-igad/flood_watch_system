# EAFW FloodWatch - Build & Deploy to Staging
# Triggers on push to eafw branch

name: Build & Deploy to Staging

on:
  push:
    branches:
      - eafw
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: eafw-cms
            dockerfile: eafw_docker/cms/Dockerfile
            build-args: ""
          - image: eafw-mapviewer
            dockerfile: eafw_docker/mapviewer/Dockerfile
            build-args: |
              CMS_API=/api
              BASE_PATH=/
              ASSET_PREFIX=
          - image: eafw-mapserver
            dockerfile: eafw_docker/mapserver/Dockerfile
            build-args: ""
          - image: eafw-mapcache
            dockerfile: eafw_docker/mapcache/Dockerfile
            build-args: ""
          - image: eafw-jobs
            dockerfile: eafw_docker/jobs/Dockerfile
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            cd ~/eafw

            # Clone or update repo
            if [ ! -d ".git" ]; then
              cd ~
              rm -rf eafw
              git clone -b eafw https://github.com/icpac-igad/flood_watch_system.git eafw
              cd eafw
              # Restore .env if backed up
              [ -f ~/eafw_env_backup ] && cp ~/eafw_env_backup .env
            else
              git fetch origin
              git reset --hard origin/eafw
            fi

            # Pull latest images
            docker compose -f docker-compose.staging.yml --env-file .env pull

            # Restart services with new images
            docker compose -f docker-compose.staging.yml --env-file .env up -d

            # Clean up old images
            docker image prune -f

            # Show running containers
            docker ps --format "table {{.Names}}\t{{.Status}}"
