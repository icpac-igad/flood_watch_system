# EAFW FloodWatch - Build & Deploy to Staging
# Triggers on push to eafw branch

name: Build & Deploy to Staging

on:
  push:
    branches:
      - eafw
  workflow_dispatch:

env:
  DOCKERHUB_NAMESPACE: hkoros254

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - image: eafw-cms
            dockerfile: eafw_docker/cms/Dockerfile
            build-args: ""
          - image: eafw-mapviewer
            dockerfile: eafw_docker/mapviewer/Dockerfile
            build-args: |
              CMS_API=/api
              BASE_PATH=/
              ASSET_PREFIX=
          - image: eafw-mapserver
            dockerfile: eafw_docker/mapserver/Dockerfile
            build-args: ""
          - image: eafw-mapcache
            dockerfile: eafw_docker/mapcache/Dockerfile
            build-args: ""
          - image: eafw-jobs
            dockerfile: eafw_docker/jobs/Dockerfile
            build-args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:v1.1
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

