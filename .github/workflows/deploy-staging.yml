# EAFW FloodWatch - Build & Deploy to Staging
# Triggers on push to eafw branch
# Only builds images when their source files change

name: Build & Deploy to Staging

on:
  push:
    branches:
      - eafw
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all images'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cms: ${{ steps.changes.outputs.cms }}
      mapviewer: ${{ steps.changes.outputs.mapviewer }}
      mapserver: ${{ steps.changes.outputs.mapserver }}
      mapcache: ${{ steps.changes.outputs.mapcache }}
      jobs: ${{ steps.changes.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for changes
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files: $CHANGED"

          if echo "$CHANGED" | grep -qE "^eafw_geomanager_web/|^eafw_geomanager/"; then
            echo "cms=true" >> $GITHUB_OUTPUT
          else
            echo "cms=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE "^eafw_geomapviewer/|^eafw_geomanager_web/docker/mapviewer/"; then
            echo "mapviewer=true" >> $GITHUB_OUTPUT
          else
            echo "mapviewer=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE "^eafw_geomanager_web/docker/mapserver/"; then
            echo "mapserver=true" >> $GITHUB_OUTPUT
          else
            echo "mapserver=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE "^eafw_geomanager_web/docker/mapcache/"; then
            echo "mapcache=true" >> $GITHUB_OUTPUT
          else
            echo "mapcache=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE "^eafw_geomanager_web/docker/jobs/|^eafw_geomanager_web/eafw_jobs/"; then
            echo "jobs=true" >> $GITHUB_OUTPUT
          else
            echo "jobs=false" >> $GITHUB_OUTPUT
          fi

  build-cms:
    name: Build CMS
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.cms == 'true' || github.event.inputs.force_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push CMS
        uses: docker/build-push-action@v5
        with:
          context: ./eafw_geomanager_web
          file: ./eafw_geomanager_web/docker/cms/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/eafw-cms:latest
            ${{ env.IMAGE_PREFIX }}/eafw-cms:${{ github.sha }}
          build-args: |
            GH_TOKEN=${{ secrets.GH_PAT }}
          no-cache: true
          cache-to: type=gha,mode=max

  build-mapviewer:
    name: Build Mapviewer
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mapviewer == 'true' || github.event.inputs.force_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Mapviewer
        uses: docker/build-push-action@v5
        with:
          context: ./eafw_geomapviewer
          file: ./eafw_geomanager_web/docker/mapviewer/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/eafw-mapviewer:latest
            ${{ env.IMAGE_PREFIX }}/eafw-mapviewer:${{ github.sha }}
          build-args: |
            CMS_API=/api
            BASE_PATH=/
            ASSET_PREFIX=
            ADMIN_BOUNDARY_API=/pg/tileserv/
            ANALYTICS_PROPERTY_ID=${{ secrets.STAGING_ANALYTICS_PROPERTY_ID }}
            NEXT_TELEMETRY_DISABLED=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mapserver:
    name: Build Mapserver
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mapserver == 'true' || github.event.inputs.force_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Mapserver
        uses: docker/build-push-action@v5
        with:
          context: ./eafw_geomanager_web
          file: ./eafw_geomanager_web/docker/mapserver/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/eafw-mapserver:latest
            ${{ env.IMAGE_PREFIX }}/eafw-mapserver:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-mapcache:
    name: Build Mapcache
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.mapcache == 'true' || github.event.inputs.force_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Mapcache
        uses: docker/build-push-action@v5
        with:
          context: ./eafw_geomanager_web
          file: ./eafw_geomanager_web/docker/mapcache/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/eafw-mapcache:latest
            ${{ env.IMAGE_PREFIX }}/eafw-mapcache:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-jobs:
    name: Build Jobs
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.jobs == 'true' || github.event.inputs.force_build == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Jobs
        uses: docker/build-push-action@v5
        with:
          context: ./eafw_geomanager_web
          file: ./eafw_geomanager_web/docker/jobs/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/eafw-jobs:latest
            ${{ env.IMAGE_PREFIX }}/eafw-jobs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [detect-changes, build-cms, build-mapviewer, build-mapserver, build-mapcache, build-jobs]
    if: always() && !cancelled()
    environment: staging
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          FLOODPROOFS_SFTP_HOST: ${{ secrets.FLOODPROOFS_SFTP_HOST }}
          FLOODPROOFS_SFTP_USER: ${{ secrets.FLOODPROOFS_SFTP_USER }}
          FLOODPROOFS_SFTP_PASSWORD: ${{ secrets.FLOODPROOFS_SFTP_PASSWORD }}
          WRF_FTP_HOST: ${{ secrets.WRF_FTP_HOST }}
          WRF_FTP_USER: ${{ secrets.WRF_FTP_USER }}
          WRF_FTP_PASSWORD: ${{ secrets.WRF_FTP_PASSWORD }}
          FLOODS_API_KEY: ${{ secrets.FLOODS_API_KEY }}
          SMTP_EMAIL_HOST: ${{ secrets.SMTP_EMAIL_HOST }}
          SMTP_EMAIL_HOST_USER: ${{ secrets.SMTP_EMAIL_HOST_USER }}
          SMTP_EMAIL_HOST_PASSWORD: ${{ secrets.SMTP_EMAIL_HOST_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 60m
          envs: GH_TOKEN,DB_PASSWORD,DJANGO_SECRET_KEY,FLOODPROOFS_SFTP_HOST,FLOODPROOFS_SFTP_USER,FLOODPROOFS_SFTP_PASSWORD,WRF_FTP_HOST,WRF_FTP_USER,WRF_FTP_PASSWORD,FLOODS_API_KEY,SMTP_EMAIL_HOST,SMTP_EMAIL_HOST_USER,SMTP_EMAIL_HOST_PASSWORD
          script: |
            set -e
            cd ~

            echo "========================================="
            echo "  STAGING DEPLOYMENT"
            echo "  $(date '+%Y-%m-%d %H:%M:%S UTC')"
            echo "========================================="

            # Login to GitHub Container Registry
            echo ${GH_TOKEN} | docker login ghcr.io -u icpac-igad --password-stdin

            # Safe repo update
            REPO_DIR=~/flood_watch_system
            if [ -d "$REPO_DIR/.git" ]; then
              echo "Updating existing repo..."
              cd $REPO_DIR
              git fetch origin
              git reset --hard origin/eafw
            else
              echo "Cloning repo..."
              git clone -b eafw https://${GH_TOKEN}@github.com/icpac-igad/flood_watch_system.git $REPO_DIR
              cd $REPO_DIR
            fi

            echo "Git SHA: $(git rev-parse --short HEAD)"

            # Work from the compose directory
            cd $REPO_DIR/eafw_geomanager_web

            # Smart .env — create from template only on first deploy
            if [ ! -f .env ]; then
              cp ../staging.env.example .env
              echo "FIRST DEPLOY: created .env from template"
            fi

            # Inject secrets
            sed -i "s|^CMS_DB_PASSWORD=.*|CMS_DB_PASSWORD=${DB_PASSWORD}|" .env
            sed -i "s|^SECRET_KEY=.*|SECRET_KEY=${DJANGO_SECRET_KEY}|" .env
            sed -i "s|^FLOODPROOFS_SFTP_HOST=.*|FLOODPROOFS_SFTP_HOST=${FLOODPROOFS_SFTP_HOST}|" .env
            sed -i "s|^FLOODPROOFS_SFTP_USER=.*|FLOODPROOFS_SFTP_USER=${FLOODPROOFS_SFTP_USER}|" .env
            sed -i "s|^FLOODPROOFS_SFTP_PASSWORD=.*|FLOODPROOFS_SFTP_PASSWORD=${FLOODPROOFS_SFTP_PASSWORD}|" .env
            sed -i "s|^WRF_FTP_HOST=.*|WRF_FTP_HOST=${WRF_FTP_HOST}|" .env
            sed -i "s|^WRF_FTP_USER=.*|WRF_FTP_USER=${WRF_FTP_USER}|" .env
            sed -i "s|^WRF_FTP_PASSWORD=.*|WRF_FTP_PASSWORD=${WRF_FTP_PASSWORD}|" .env
            sed -i "s|^FLOODS_API_KEY=.*|FLOODS_API_KEY=${FLOODS_API_KEY}|" .env
            sed -i "s|^SMTP_EMAIL_HOST=.*|SMTP_EMAIL_HOST=${SMTP_EMAIL_HOST}|" .env
            sed -i "s|^SMTP_EMAIL_HOST_USER=.*|SMTP_EMAIL_HOST_USER=${SMTP_EMAIL_HOST_USER}|" .env
            sed -i "s|^SMTP_EMAIL_HOST_PASSWORD=.*|SMTP_EMAIL_HOST_PASSWORD=${SMTP_EMAIL_HOST_PASSWORD}|" .env
            sed -i "s|^CMS_DEBUG=.*|CMS_DEBUG=False|" .env

            # Database backup
            mkdir -p ~/eafw-backups
            DB_STATUS=$(docker inspect --format='{{.State.Status}}' eafw-pgdb 2>/dev/null || echo "none")
            if [ "$DB_STATUS" = "running" ]; then
              echo "Backing up database..."
              BACKUP="$HOME/eafw-backups/staging_db_$(date +%Y%m%d_%H%M%S).dump"
              docker exec eafw-pgdb pg_dump -U ${CMS_DB_USER:-geomanager} -Fc ${CMS_DB_NAME:-geomanager_web} > "$BACKUP" || echo "WARN: backup failed"
              ls -t ~/eafw-backups/staging_db_*.dump 2>/dev/null | tail -n +6 | xargs rm -f 2>/dev/null
            fi

            # Stop old project containers (from previous monorepo layout)
            if [ -f ~/flood_watch_system/docker-compose.staging.yml ]; then
              docker compose -f ~/flood_watch_system/docker-compose.staging.yml --env-file ~/flood_watch_system/.env down 2>/dev/null || true
            fi
            # Also remove any leftover eafw containers by name
            docker ps -a --format '{{.Names}}' | grep '^eafw-' | xargs -r docker rm -f 2>/dev/null || true

            # Pull and deploy
            docker compose pull --ignore-pull-failures
            docker compose up -d

            # Wait for DB
            echo "Waiting for database..."
            for i in $(seq 1 60); do
              if docker exec eafw-pgdb pg_isready -U ${CMS_DB_USER:-geomanager} 2>/dev/null; then
                echo "DB ready after $((i*5))s"
                break
              fi
              sleep 5
            done

            # Wait for CMS and run migrations
            echo "Waiting for CMS..."
            for i in $(seq 1 30); do
              if docker exec eafw-cms curl -sf http://localhost:8000/ >/dev/null 2>&1; then
                echo "CMS ready"
                docker exec eafw-cms /home/app/.venv/bin/python manage.py migrate --noinput 2>&1 || true
                docker exec eafw-cms /home/app/.venv/bin/python manage.py collectstatic --clear --no-input 2>&1 || true
                break
              fi
              sleep 5
            done

            # Reload nginx
            docker exec eafw-nginx nginx -s reload 2>&1 || docker restart eafw-nginx

            # Cleanup
            docker image prune -f 2>/dev/null || true

            # Health check
            echo ""
            echo "========================================="
            echo "  DEPLOYMENT SUMMARY"
            echo "========================================="
            docker ps --format "table {{.Names}}\t{{.Status}}" | grep eafw
            echo "========================================="
            echo "Staging deploy successful!"
