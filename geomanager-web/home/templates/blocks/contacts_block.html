<div class="report-section contacts-section mb-4">
    <h3 class="section-heading">{{ value.heading }}</h3>

    <div class="row g-3">
        {% for contact in value.contacts %}
            <div class="col-md-6 col-lg-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{ contact.name }}</h5>
                        {% if contact.role %}
                            <p class="card-subtitle text-muted mb-2">{{ contact.role }}</p>
                        {% endif %}
                        {% if contact.email %}
                            <p class="mb-1">
                                <i class="bi bi-envelope me-2"></i>
                                <a href="mailto:{{ contact.email }}">{{ contact.email }}</a>
                            </p>
                        {% endif %}
                        {% if contact.phone %}
                            <p class="mb-0">
                                <i class="bi bi-telephone me-2"></i>
                                <a href="tel:{{ contact.phone }}">{{ contact.phone }}</a>
                            </p>
                        {% endif %}
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
