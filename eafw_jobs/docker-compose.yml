version: '3.8'

services:
  downloader:
    container_name: ${CNTRS_PREFIX:-eafw}-floodwatch-downloader
    image: ${JOBS_IMAGE_NAME:-icpac/floodwatch-jobs}
    command: python -m pyfloodwatch.download
    restart: ${RESTART_POLICY:-always}
    build:
      context: ./
      dockerfile: ${SERVICE_DOCKERFILE:-Dockerfile}
    environment:
      # Database connection
      - DB_HOST=${DB_HOST:-eahw-pgdb}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-eahw_mapserver}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

      # FloodProofs SFTP
      - FLOODPROOFS_SFTP_HOST=${FLOODPROOFS_SFTP_HOST:-197.254.113.173}
      - FLOODPROOFS_SFTP_PORT=${FLOODPROOFS_SFTP_PORT:-22}
      - FLOODPROOFS_SFTP_USER=${FLOODPROOFS_SFTP_USER:-floodproofs}
      - FLOODPROOFS_SFTP_PASSWORD=${FLOODPROOFS_SFTP_PASSWORD}
      - FLOODPROOFS_REMOTE_DIR=${FLOODPROOFS_REMOTE_DIR:-/home/floodproofs/merged_forecasts}

      # Ensemble FTP
      - ENSEMBLE_FTP_HOST=${ENSEMBLE_FTP_HOST:-41.215.21.156}
      - ENSEMBLE_FTP_PORT=${ENSEMBLE_FTP_PORT:-21}
      - ENSEMBLE_FTP_USER=${ENSEMBLE_FTP_USER:-geosfm}
      - ENSEMBLE_FTP_PASSWORD=${ENSEMBLE_FTP_PASSWORD}
      - ENSEMBLE_REMOTE_DIR=${ENSEMBLE_REMOTE_DIR:-/ftproot/output/Combined}

      # Sync settings
      - SYNC_INTERVAL=${SYNC_INTERVAL:-21600}  # 6 hours
      - SYNC_DAYS=${SYNC_DAYS:-7}

    volumes:
      - ${DATA_DIR:-./data}:/floodwatch_jobs/app/data
      - ${LOGS_DIR:-./logs}:/floodwatch_jobs/app/logs
    networks:
      - eafw_network

  watcher:
    container_name: ${CNTRS_PREFIX:-eafw}-floodwatch-watcher
    image: ${JOBS_IMAGE_NAME:-icpac/floodwatch-jobs}
    command: python -m pyfloodwatch.watcher
    restart: ${RESTART_POLICY:-always}
    environment:
      - DB_HOST=${DB_HOST:-eahw-pgdb}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-eahw_mapserver}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - WATCH_DIR=/floodwatch_jobs/app/data/download
    volumes:
      - ${DATA_DIR:-./data}:/floodwatch_jobs/app/data
      - ${LOGS_DIR:-./logs}:/floodwatch_jobs/app/logs
    networks:
      - eafw_network

networks:
  eafw_network:
    external: true
