[tool.poetry]
name = "pyfloodwatch"
version = "0.1.0"
description = "FloodWatch data jobs - automated data syncing and ingestion"
authors = ["ICPAC <info@icpac.net>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
psycopg2-binary = "^2.9.9"
paramiko = "^3.4.0"
python-dotenv = "^1.0.0"
watchdog = "^4.0.0"
APScheduler = "^3.10.4"
google-api-python-client = "^2.108.0"
google-auth = "^2.25.0"
google-auth-httplib2 = "^0.2.0"
google-auth-oauthlib = "^1.2.0"
numpy = "^1.26.0"
xarray = "^2024.1.0"
# s3fs + zarr are required for the GEOGloWS zarr-on-S3 ingest path
# (pyfloodwatch.geoglows_sync). fsspec is pulled in transitively but
# pinned-compatible here for clarity.
s3fs = "^2024.1.0"
zarr = "^2.17"
fsspec = "^2024.1.0"
pandas = "^2.1.0"
netCDF4 = "^1.6.5"
rasterio = "^1.3.0"
SQLAlchemy = "^2.0.0"
pystac = "^1.9.0"
requests = "^2.31.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
