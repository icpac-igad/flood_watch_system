<div class="report-section statistics-section mb-4">
    {% if value.heading %}
        <h3 class="section-heading">{{ value.heading }}</h3>
    {% endif %}

    <div class="row g-3">
        {% for stat in value.statistics %}
            <div class="col-md-4 col-lg-2">
                <div class="card text-center h-100 border-{{ stat.color }}">
                    <div class="card-body">
                        {% if stat.icon %}
                            <i class="bi {{ stat.icon }} fs-2 text-{{ stat.color }}"></i>
                        {% endif %}
                        <h2 class="card-title text-{{ stat.color }} mb-1">{{ stat.value }}</h2>
                        <p class="card-text small text-muted mb-0">{{ stat.label }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
